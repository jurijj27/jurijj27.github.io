<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дети — запись и таблица</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --card: #ffffff;
        --text: #1a1a1a;
        --border: #d2d6de;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --danger: #ef4444;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        padding: 16px;
        margin: 0;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: var(--card);
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        padding: 20px;
      }

      h2, h3 { margin-top: 0; margin-bottom: 14px; }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }
      @media (max-width: 640px) {
        .form-grid { grid-template-columns: 1fr; }
      }

      .form-group { margin-bottom: 12px; }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #4b5563;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        transition: border-color 0.2s;
      }
      input:focus { outline: none; border-color: var(--primary); }

      button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      button:hover { background-color: var(--primary-hover); }
      button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

      .table-wrapper {
        overflow-x: auto;
        margin-top: 24px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        background: white;
      }
      th, td {
        border: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
      }
      th {
        background-color: #f8fafc;
        font-weight: 600;
        font-size: 13px;
        color: #475569;
      }
      tr:hover { background-color: #f1f5f9; }

      .status {
        margin-top: 12px;
        font-size: 13px;
        color: #64748b;
      }
      .status.error { color: var(--danger); }
      .loading { opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Добавить ребёнка</h2>

      <div class="form-grid">
        <div class="form-group">
          <label for="surname">Фамилия *</label>
          <input type="text" id="surname" placeholder="Иванов" required>
        </div>
        <div class="form-group">
          <label for="name">Имя *</label>
          <input type="text" id="name" placeholder="Иван" required>
        </div>
        <div class="form-group">
          <label for="patronymic">Отчество</label>
          <input type="text" id="patronymic" placeholder="Иванович">
        </div>
      </div>

      <div class="form-group">
        <label for="dob">Дата рождения (ДД.ММ.ГГГГ) *</label>
        <input type="text" id="dob" placeholder="01.01.2020" maxlength="10" required>
      </div>
      <div class="form-group">
        <label for="phone">Телефон *</label>
        <input type="tel" id="phone" placeholder="+79990000000" required>
      </div>

      <!-- ВСТАВЬТЕ СЮДА ВАШ URL ПОСЛЕ ПЕРЕРАЗВЕРТЫВАНИЯ -->
      <input type="hidden" id="webAppUrl" value="https://script.google.com/macros/s/AKfycbxaaM9tjgp2Lnl37CXQXeMWALR_YOvQJf6Edoa-FBUQlxEmU-18_2zGWViwOl0FGhqd3Q/exec">

      <button id="addBtn">Добавить</button>

      <h3>Таблица детей</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>№ пп</th>
              <th>Фамилия</th>
              <th>Имя</th>
              <th>Отчество</th>
              <th>Дата рождения</th>
              <th>Телефон</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <p id="status" class="status loading">Загрузка данных из Google Sheets…</p>
    </div>

<script>
  const surnameInput = document.getElementById('surname');
  const nameInput = document.getElementById('name');
  const patronymicInput = document.getElementById('patronymic');
  const dobInput = document.getElementById('dob');
  const phoneInput = document.getElementById('phone');
  const addBtn = document.getElementById('addBtn');
  const tbody = document.getElementById('table-body');
  const statusEl = document.getElementById('status');
  const webAppUrl = document.getElementById('webAppUrl').value;

  // Автоматическая маска для ввода даты рождения (ДД.ММ.ГГГГ)
  dobInput.addEventListener('input', (e) => {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length > 8) v = v.substring(0, 8);
    if (v.length > 4) {
      e.target.value = `${v.substring(0,2)}.${v.substring(2,4)}.${v.substring(4,8)}`;
    } else if (v.length > 2) {
      e.target.value = `${v.substring(0,2)}.${v.substring(2,4)}`;
    } else {
      e.target.value = v;
    }
  });

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"]/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[s]));
  }

  async function loadTable() {
    if (webAppUrl.includes('ABC123XYZ')) {
      statusEl.textContent = 'Внимание: Замените тестовый URL веб-приложения на свой.';
      statusEl.className = 'status error';
      return;
    }
    statusEl.textContent = 'Загрузка данных…';
    statusEl.className = 'status loading';
    tbody.innerHTML = '';

    try {
      const res = await fetch(webAppUrl);
      if (!res.ok) throw new Error('Ошибка сети при чтении');
      const json = await res.json();
      const rows = json.data || [];

      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Пока нет записей</td></tr>';
      } else {
        rows.forEach((row) => {
          const tr = document.createElement('tr');
          let formattedDob = row['Дата рождения'];
          if (formattedDob && formattedDob.includes('T')) {
            formattedDob = new Date(formattedDob).toLocaleDateString('ru-RU');
          }
          
          tr.innerHTML = `
            <td>${escapeHtml(row['№ пп'])}</td>
            <td><strong>${escapeHtml(row['Фамилия'])}</strong></td>
            <td>${escapeHtml(row['Имя'])}</td>
            <td>${escapeHtml(row['Отчество'])}</td>
            <td>${escapeHtml(formattedDob)}</td>
            <td>${escapeHtml(row['Телефон'])}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      statusEl.textContent = `Данные синхронизированы. Всего записей: ${rows.length}`;
      statusEl.className = 'status';
    } catch (e) {
      console.error(e);
      statusEl.textContent = 'Ошибка загрузки данных.';
      statusEl.className = 'status error';
    }
  }

  addBtn.addEventListener('click', async () => {
    const surname = surnameInput.value.trim();
    const name = nameInput.value.trim();
    const patronymic = patronymicInput.value.trim();
    const dob = dobInput.value.trim();
    const phone = phoneInput.value.trim();

    if (!surname || !name || !dob || !phone) {
      alert('Пожалуйста, заполните все обязательные поля со звездочкой (*)');
      return;
    }

    addBtn.disabled = true;
    statusEl.textContent = 'Сохранение в Google Sheets…';
    statusEl.className = 'status loading';

    const payload = { surname, name, patronymic, dob, phone };

    try {
      // Используем mode: 'no-cors' для обхода любых ограничений браузера при отправке данных
      await fetch(webAppUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' }, 
        body: JSON.stringify(payload),
      });

      // При no-cors ответ прочесть нельзя (он opaque), но данные гарантированно доходят.
      // Поэтому сразу очищаем форму и обновляем таблицу через doGet.
      statusEl.textContent = 'Успешно сохранено! Обновляем список…';
      surnameInput.value = '';
      nameInput.value = '';
      patronymicInput.value = '';
      dobInput.value = '';
      phoneInput.value = '';

      // Небольшая пауза, чтобы Google Sheets успел записать строку перед чтением
      setTimeout(async () => {
        await loadTable();
      }, 800);

    } catch (e) {
      console.error(e);
      statusEl.textContent = 'Ошибка сети. Проверьте консоль.';
      statusEl.className = 'status error';
    } finally {
      addBtn.disabled = false;
    }
  });

  loadTable();
</script>

  </body>
</html>
