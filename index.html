<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дети — запись и таблица</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --card: #ffffff;
        --text: #1a1a1a;
        --border: #d2d6de;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --danger: #ef4444;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        padding: 16px;
        margin: 0;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: var(--card);
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        padding: 20px;
      }

      h2, h3 { margin-top: 0; margin-bottom: 14px; }

      /* Адаптивная сетка для трёх полей ФИО */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }
      @media (max-width: 640px) {
        .form-grid { grid-template-columns: 1fr; }
      }

      .form-group { margin-bottom: 12px; }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #4b5563;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        transition: border-color 0.2s;
      }
      input:focus { outline: none; border-color: var(--primary); }

      button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      button:hover { background-color: var(--primary-hover); }
      button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 24px;
        background: white;
      }
      th, td {
        border: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
      }
      th {
        background-color: #f8fafc;
        font-weight: 600;
        font-size: 13px;
        color: #475569;
      }
      tr:hover { background-color: #f1f5f9; }

      .status {
        margin-top: 12px;
        font-size: 13px;
        color: #64748b;
      }
      .status.error { color: var(--danger); }
      .loading { opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Добавить ребёнка</h2>

      <div class="form-grid">
        <div class="form-group">
          <label for="surname">Фамилия</label>
          <input type="text" id="surname" placeholder="Иванов">
        </div>
        <div class="form-group">
          <label for="name">Имя</label>
          <input type="text" id="name" placeholder="Иван">
        </div>
        <div class="form-group">
          <label for="patronymic">Отчество</label>
          <input type="text" id="patronymic" placeholder="Иванович">
        </div>
      </div>

      <div class="form-group">
        <label for="dob">Дата рождения (ДД.ММ.ГГГГ)</label>
        <input type="text" id="dob" placeholder="01.01.2020">
      </div>
      <div class="form-group">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" placeholder="+79990000000">
      </div>

      <!-- ВСТАВЬ СЮДА СВОЙ URL ИЗ APPS SCRIPT -->
      <input type="hidden" id="webAppUrl" value="https://script.google.com/macros/s/AKfycbxFemGbNJE-qKlq7HzO236VNmFwXQA3C1Tf68ICMRS_HNwU8IGO8h4Tx86WDXA490swMw/exec">

      <button id="addBtn">Добавить</button>

      <h3>Таблица детей</h3>
      <table>
        <thead>
          <tr>
            <th>№ пп</th>
            <th>Фамилия</th>
            <th>Имя</th>
            <th>Отчество</th>
            <th>Дата рождения</th>
            <th>Телефон</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>

      <p id="status" class="status loading">Загрузка данных из Google Sheets…</p>
    </div>

    <script>
      const surnameInput = document.getElementById('surname');
      const nameInput = document.getElementById('name');
      const patronymicInput = document.getElementById('patronymic');
      const dobInput = document.getElementById('dob');
      const phoneInput = document.getElementById('phone');
      const addBtn = document.getElementById('addBtn');
      const tbody = document.getElementById('table-body');
      const statusEl = document.getElementById('status');
      const webAppUrl = document.getElementById('webAppUrl').value;

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"]/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[s]));
      }

      async function loadTable() {
        statusEl.textContent = 'Загрузка данных…';
        statusEl.className = 'status loading';
        tbody.innerHTML = '';

        try {
          const res = await fetch(webAppUrl);
          if (!res.ok) throw new Error('Network error');
          const json = await res.json();
          const rows = json.data || [];

          if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Пока нет записей</td></tr>';
          } else {
            rows.forEach((row, idx) => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${escapeHtml(row['№ пп'])}</td>
                <td><strong>${escapeHtml(row['Фамилия'])}</strong></td>
                <td>${escapeHtml(row['Имя'])}</td>
                <td>${escapeHtml(row['Отчество'])}</td>
                <td>${escapeHtml(row['Дата рождения'])}</td>
                <td>${escapeHtml(row['Телефон'])}</td>
              `;
              tbody.appendChild(tr);
            });
          }

          statusEl.textContent = `Загружено ${rows.length} записей. Данные из Google Sheets.`;
          statusEl.className = 'status';
        } catch (e) {
          console.error(e);
          statusEl.textContent = 'Ошибка загрузки. Проверьте URL веб‑приложения.';
          statusEl.className = 'status error';
        }
      }

      addBtn.addEventListener('click', async () => {
        const surname = surnameInput.value.trim();
        const name = nameInput.value.trim();
        const patronymic = patronymicInput.value.trim();
        const dob = dobInput.value.trim();
        const phone = phoneInput.value.trim();

        if (!surname || !name || !dob || !phone) {
          alert('Заполните обязательные поля: Фамилия, Имя, Дата рождения, Телефон');
          return;
        }

        addBtn.disabled = true;
        statusEl.textContent = 'Отправка данных…';
        statusEl.className = 'status loading';

        const payload = { surname, name, patronymic, dob, phone };

        try {
          const res = await fetch(webAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await res.json();
          if (data.status === 'ok') {
            statusEl.textContent = 'Данные сохранены! Перезагрузка таблицы…';
            surnameInput.value = '';
            nameInput.value = '';
            patronymicInput.value = '';
            dobInput.value = '';
            phoneInput.value = '';

            await loadTable();
          } else {
            statusEl.textContent = 'Ошибка при сохранении.';
            statusEl.className = 'status error';
          }
        } catch (e) {
          console.error(e);
          statusEl.textContent = 'Ошибка сети. Проверьте консоль.';
          statusEl.className = 'status error';
        } finally {
          addBtn.disabled = false;
        }
      });

      loadTable();
    </script>
  </body>
</html>
