<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Дети — Google Sheets</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

      .form-group { margin-bottom: 12px; }
      label { display: block; margin-bottom: 4px; font-weight: 500; }
      input { width: 100%; padding: 8px; box-sizing: border-box; }
      button { padding: 8px 16px; cursor: pointer; }

      table {
        border-collapse: collapse;
        margin-top: 24px;
        width: 100%;
        max-width: 900px;
      }
      th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
      th { background: #f5f5f5; }
    </style>
  </head>
  <body>
    <h2>Добавить ребёнка</h2>

    <div class="form-grid">
      <div class="form-group">
        <label for="surname">Фамилия</label>
        <input type="text" id="surname" placeholder="Иванов">
      </div>
      <div class="form-group">
        <label for="name">Имя</label>
        <input type="text" id="name" placeholder="Иван">
      </div>
      <div class="form-group">
        <label for="patronymic">Отчество</label>
        <input type="text" id="patronymic" placeholder="Иванович">
      </div>
    </div>

    <div class="form-group">
      <label for="dob">Дата рождения (ДД.ММ.ГГГГ)</label>
      <input type="text" id="dob" placeholder="01.01.2020">
    </div>
    <div class="form-group">
      <label for="phone">Телефон</label>
      <input type="text" id="phone" placeholder="+79990000000">
    </div>

    <!-- Вставь сюда свой URL веб‑приложения из Шага 2 -->
    <input type="hidden" id="webAppUrl" value="https://script.google.com/macros/s/AKfycbwyBJFgN3tmoQGGB0zUE_dJEemh2dIjhNMmrQtbTiUDxxxCl6AF3ThN_SQgip2kkA8C9g/exec">

    <button id="addBtn">Добавить</button>

    <h3>Таблица детей</h3>
    <table>
      <thead>
        <tr>
          <th>№ пп</th>
          <th>Фамилия</th>
          <th>Имя</th>
          <th>Отчество</th>
          <th>Дата рождения</th>
          <th>Телефон</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <script>
      const surnameInput = document.getElementById('surname');
      const nameInput = document.getElementById('name');
      const patronymicInput = document.getElementById('patronymic');
      const dobInput = document.getElementById('dob');
      const phoneInput = document.getElementById('phone');
      const addBtn = document.getElementById('addBtn');
      const tbody = document.getElementById('table-body');
      const webAppUrl = document.getElementById('webAppUrl').value;

      async function loadTable() {
        // Для демонстрации просто очищаем и говорим, что данные в Sheets
        tbody.innerHTML = '<tr><td colspan="6">Данные загружаются из Google Sheets…</td></tr>';

        // Вариант А: читать через Sheets API (нужен API ключ и CORS) — сложнее.
        // Вариант Б (проще для MVP): просто показать, что запись ушла, и обновить вручную.
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">Таблица синхронизируется с Google Sheets.<br>Обновите страницу или откройте таблицу отдельно.</td></tr>';
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"]/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[s]));
      }

      addBtn.addEventListener('click', async () => {
        const surname = surnameInput.value.trim();
        const name = nameInput.value.trim();
        const patronymic = patronymicInput.value.trim();
        const dob = dobInput.value.trim();
        const phone = phoneInput.value.trim();

        if (!surname || !name || !dob || !phone) {
          alert('Заполните обязательные поля: Фамилия, Имя, Дата рождения, Телефон');
          return;
        }

        const payload = { surname, name, patronymic, dob, phone };

        try {
          const res = await fetch(webAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await res.json();
          if (data.status === 'ok') {
            alert('Ребёнок добавлен в Google Таблицу!');
            surnameInput.value = '';
            nameInput.value = '';
            patronymicInput.value = '';
            dobInput.value = '';
            phoneInput.value = '';
            loadTable();
          } else {
            alert('Ошибка при сохранении');
          }
        } catch (e) {
          console.error(e);
          alert('Ошибка сети или CORS. Проверьте URL веб‑приложения.');
        }
      });

      loadTable();
    </script>
  </body>
</html>
